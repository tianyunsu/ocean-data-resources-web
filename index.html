<style>
:root{

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);

header{background:linear-gradient(135deg,#0b6bcb,#0a4f8f);color:#fff;padding:22px 20px}
header h1{margin:0 0 6px;font-size:20px;font-weight:650}
header .sub{opacity:.9;font-size:13px}
.wrap{max-width:1500px;margin:0 auto;padding:16px}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-width:96px}
.stat b{display:block;font-size:19px;color:var(--brand)}
.stat span{font-size:12px;color:var(--muted)}
.bar{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px;
  display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar input[type=search]{flex:1 1 260px;min-width:200px;padding:8px 11px;border:1px solid var(--line);
  border-radius:7px;font-size:14px}
.bar select,.bar button{padding:8px 10px;border:1px solid var(--line);border-radius:7px;
  background:#fff;font-size:13px;color:var(--text);cursor:pointer}
.bar button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.bar button:hover{filter:brightness(.96)}
.hint{font-size:12px;color:var(--muted);margin:0 0 10px}
table{width:100%;border-collapse:collapse;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--brand-soft);font-weight:600;cursor:pointer;white-space:nowrap;position:sticky;top:0;z-index:2}
th.no-sort{cursor:default}
tbody tr:hover{background:#f2f6fa}
td.name{font-weight:600;color:var(--brand);cursor:pointer;max-width:340px}
td.url{max-width:280px;word-break:break-all;font-size:12px}
td.dl{max-width:420px;font-size:12px;color:var(--muted)}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
.tag{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;
  background:var(--chip);color:var(--muted);white-space:nowrap}
.tag.a{background:#e6f4ea;color:var(--ok)} .tag.b{background:#fff4e5;color:var(--warn)}
.tag.c{background:#fdecec;color:var(--bad)} .tag.d{background:#eef1f4;color:var(--muted)}
.score{font-weight:700}
.det{background:#fbfcfd;border-top:1px dashed var(--line)}
.det td{padding:12px 14px}
.det h4{margin:0 0 6px;font-size:13px;color:var(--muted)}
.det p{margin:0 0 10px;font-size:13px;white-space:pre-wrap}
.linklist{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.subline{font-size:12px;color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted)}
footer{padding:20px;text-align:center;color:var(--muted);font-size:12px}
@media(max-width:820px){
  table,thead,tbody,tr,td{display:block;width:100%}
  thead{display:none}
  tbody tr{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;background:#fff;padding:6px}
  td{border:none;padding:4px 10px}
  td.url,td.dl{max-width:none}
}
</style>

<script>
const DATA = JSON.parse(document.getElementById('payload').textContent);
const rows = DATA.items;
const $ = id => document.getElementById(id);

function uniq(k){ return [...new Set(rows.map(r=>r[k]).filter(Boolean))].sort(); }
function fill(id, vals, labelFn){
  const el = $(id);
  vals.forEach(v => { const o=document.createElement('option'); o.value=v; o.textContent=labelFn?labelFn(v):v; el.appendChild(o); });
}
fill('f-cat', DATA.cats.map(c=>c.name));
fill('f-qc', uniq('qc'));
fill('f-crawl', uniq('crawl'));
fill('f-country', uniq('country'));
fill('f-verify', uniq('verify'));

let sortKey='score', sortDir=-1, openSet=new Set();
const state = () => ({q:$('q').value.trim(), cat:$('f-cat').value, qc:$('f-qc').value,
  crawl:$('f-crawl').value, country:$('f-country').value, verify:$('f-verify').value});

function match(r, s){
  if(s.cat && r.cat!==s.cat) return false;
  if(s.qc && r.qc!==s.qc) return false;
  if(s.crawl && r.crawl!==s.crawl) return false;
  if(s.country && r.country!==s.country) return false;
  if(s.verify && r.verify!==s.verify) return false;
  if(!s.q) return true;
  const hay = [r.name,r.org,r.country,r.note,r.dl,r.url,r.cat,r.crawl].join(' ').toLowerCase();
  return s.q.toLowerCase().split(/\s+/).every(t => hay.includes(t));
}

// 从「可爬取内容」里抽出真实 URL，直接做成可点击按钮
function urls(text){
  // 排除集里必须含反引号与中文标点：清单里的 URL 常写成 `https://...`、OPeNDAP 这种形式，
  // 否则抽出来的链接会带上 `、OPeNDAP 之类的尾巴。
  const out=[]; const re=/https?:\/\/[^\s·，。）)"'`，、；]+/g; let m;
  while((m=re.exec(text||''))){ let u=m[0].replace(/[.,;、，]+$/,''); if(!out.includes(u)) out.push(u); }
  return out.slice(0,8);
}

function esc(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(){
  const s = state();
  let list = rows.filter(r => match(r, s));
  list.sort((a,b)=>{
    let x=a[sortKey], y=b[sortKey];
    if(x==null) x = sortDir>0 ? Infinity : -Infinity;
    if(y==null) y = sortDir>0 ? Infinity : -Infinity;
    if(typeof x==='number' && typeof y==='number') return (x-y)*sortDir;
    return String(x).localeCompare(String(y),'zh')*sortDir;
  });

  // 统计条
  const cnt = k => list.filter(r=>r.qc===k).length;
  const auto = list.filter(r=>/API|直链/.test(r.crawl)).length;
  const cred = list.filter(r=>/凭证/.test(r.crawl)).length;
  $('stats').innerHTML = [
    ['当前结果', list.length], ['A 级', cnt('A')], ['B 级', cnt('B')], ['C 级', cnt('C')],
    ['D 级', cnt('D')], ['免凭证可脚本化', auto], ['需凭证', cred]
  ].map(([k,v])=>`<div class="stat"><b>${v}</b><span>${k}</span></div>`).join('');

  $('empty').style.display = list.length ? 'none':'block';
  const tb = $('tb');
  tb.innerHTML = list.map((r,i)=>{
    const key = r.catfile+'#'+r.no;
    const open = openSet.has(key);
    const cls = (r.qc||'').toLowerCase();
    const us = urls(r.dl);
    let tr = `<tr><td>${esc(r.no)}</td>`
      + `<td class="name" data-key="${esc(key)}">${esc(r.name)}</td>`
      + `<td>${esc(r.org)}</td><td>${esc(r.country)}</td>`
      + `<td class="score">${r.score==null?'-':r.score}</td>`
      + `<td><span class="tag ${cls}">${esc(r.qc)}</span></td>`
      + `<td>${esc(r.crawl)}</td>`
      + `<td class="dl">${us.length?us.slice(0,2).map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.length>52?u.slice(0,52)+'…':u)}</a>`).join('<br>'):'<span class="subline">—</span>'}</td>`
      + `<td class="url">${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.url)}</a>`:'—'}</td></tr>`;
    if(open){
      const sub = Object.entries(r.sub||{}).filter(([,v])=>v!=null)
        .map(([k,v])=>`${k} ${v}`).join(' · ');
      tr += `<tr class="det"><td colspan="9">
        <h4>说明</h4><p>${esc(r.note)||'—'}</p>
        ${sub?`<h4>评分明细</h4><p class="subline">${esc(sub)}</p>`:''}
        <h4>可爬取内容 / 下载入口</h4>
        <div class="linklist">${us.map(u=>`<a class="tag" href="${esc(u)}" target="_blank" rel="noopener">${esc(u.length>64?u.slice(0,64)+'…':u)}</a>`).join('')||'<span class="subline">无公开入口</span>'}</div>
        <p class="subline">${esc(r.dl)||'—'}</p>
        ${us.length?`<button class="tag" data-copy="${esc(us.join('\n'))}">复制全部下载入口</button>`:''}
      </td></tr>`;
    }
    return tr;
  }).join('');

  tb.querySelectorAll('td.name').forEach(td=>td.onclick=()=>{
    const k=td.dataset.key; openSet.has(k)?openSet.delete(k):openSet.add(k); render();
  });
  tb.querySelectorAll('button[data-copy]').forEach(b=>b.onclick=()=>{
    navigator.clipboard.writeText(b.dataset.copy).then(()=>{const t=b.textContent;b.textContent='已复制 ✓';setTimeout(()=>b.textContent=t,1500);});
  });
  try{ location.hash = encodeURIComponent(JSON.stringify(s)); }catch(e){}
}

document.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{
  const k=th.dataset.k;
  if(sortKey===k) sortDir=-sortDir; else {sortKey=k; sortDir=(k==='score'?-1:1);}
  render();
});
['q','f-cat','f-qc','f-crawl','f-country','f-verify'].forEach(id=>{
  $(id).addEventListener('input', render); $(id).addEventListener('change', render);
});
$('reset').onclick=()=>{ ['q'].forEach(i=>$(i).value='');
  ['f-cat','f-qc','f-crawl','f-country','f-verify'].forEach(i=>$(i).value='');
  openSet.clear(); render(); };
$('export').onclick=()=>{
  const s=state(); const list=rows.filter(r=>match(r,s));
  const cols=['no','cat','name','org','country','verify','access','url','score','qc','crawl','note','dl'];
  const head=['序号','类别','资源名称','维护机构','国家/地区','验证','获取方式','网址','总分','质控等级','可爬取','说明','可爬取内容'];
  const esc2=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const csv='\ufeff'+[head.join(',')].concat(list.map(r=>cols.map(c=>esc2(r[c])).join(','))).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='海洋数据资源清单_筛选结果.csv'; a.click();
};
document.addEventListener('keydown',e=>{ if(e.key==='/'&&document.activeElement!==$('q')){e.preventDefault();$('q').focus();} });
render();
</script>
